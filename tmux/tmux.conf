# ---- scrollback on a touchscreen / headless SSH client ----

# 1. Keep a lot more history (default is a measly 2000 lines)
set -g history-limit 100000

# 2. Mouse mode: makes touch-drag and two-finger scroll enter copy mode
#    and scroll the buffer. This is the main fix on Android.
set -g mouse on

# 3. vi-style keys inside copy mode (h/j/k/l, /search, g/G for top/bottom)
setw -g mode-keys vi

# 4. Don't jump back to the bottom the instant you release a drag --
#    keeps the selection and stays in copy mode so you can keep scrolling.
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-no-clear

# 5. Wheel / swipe enters copy mode automatically instead of being
#    forwarded to the shell as arrow keys.
bind -n WheelUpPane if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" \
  "send -M" "select-pane -t=; copy-mode -e; send -M"
bind -n WheelDownPane select-pane -t=\; send -M

# ---- keyboard fallbacks, for when the soft keyboard has no gestures ----

# prefix + Up  -> enter copy mode already scrolling
bind Up   copy-mode \; send -X cursor-up
bind PPage copy-mode \; send -X page-up

# Inside copy mode, page with space/backspace (easy on a soft keyboard)
bind -T copy-mode-vi Space send -X page-down
bind -T copy-mode-vi BSpace send -X page-up
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi q send -X cancel

# prefix + r  -> reload this file
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# Report the terminal honestly so colors/keys behave over SSH
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Longer message display -- easier to read on a phone
set -g display-time 2000
